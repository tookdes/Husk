name: Build iOS 15 TrollStore IPA

on:
  push:
    branches:
      - ios15-trollstore
  workflow_dispatch:

concurrency:
  group: ios15-trollstore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          brew install autoconf automake libtool meson ninja pkg-config xcodegen qemu
          rustup target add aarch64-apple-ios

      - name: Restore Husk toolchain
        id: husk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/sources
            third_party/build
            build/ios-arm64
          key: husk-ios15-xcode26-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/sources.sh', 'scripts/build_ios.sh', 'scripts/integrate_husk.sh', 'patches/*.patch', 'src/ios-jit/**') }}
          restore-keys: |
            husk-ios15-xcode26-${{ runner.os }}-${{ runner.arch }}-

      - name: Build IPA
        env:
          SDKMINVER: "15.0"
        run: |
          xcodebuild -version
          chmod +x scripts/*.sh
          ./scripts/ci_build.sh build/Husk-iOS15-TrollStore.ipa

      - name: Inspect minimum OS
        run: |
          unzip -q build/Husk-iOS15-TrollStore.ipa -d /tmp/husk-ipa
          plutil -p /tmp/husk-ipa/Payload/Husk.app/Info.plist | grep -E 'MinimumOSVersion|UIDeviceFamily'
          otool -l /tmp/husk-ipa/Payload/Husk.app/Husk | grep -A5 LC_BUILD_VERSION || true
          otool -l /tmp/husk-ipa/Payload/Husk.app/Frameworks/libqemu-aarch64-softmmu.dylib | grep -A5 LC_BUILD_VERSION || true

      - name: Save Husk toolchain
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/sources
            third_party/build
            build/ios-arm64
          key: ${{ steps.husk-cache.outputs.cache-primary-key }}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-iOS15-build-logs
          path: |
            build/logs
            /tmp/husk_ipa/build.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-iOS15-TrollStore
          path: build/Husk-iOS15-TrollStore.ipa
          if-no-files-found: error
